[build-system]
requires = ["setuptools>=72", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arepy-ui"
description = "An open-source ui library for arepy"
authors = [{ name = "Abrahan Gil", email = "scr44gr@protonmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    'Development Status :: 3 - Alpha',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Operating System :: MacOS :: MacOS X',
]
keywords = ['arepy', 'ui', 'library', 'python']
requires-python = ">=3.10"
dependencies = ["arepy"]
dynamic = ['version']
readme = "README.md"

[project.optional-dependencies]
full = ["av==16.0.1", "numpy==2.3.5"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "cython>=3.0", "ruff>=0.14.10"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-glightbox",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-plugin",
]
markup = ["cython>=3.0"]

[project.scripts]
# Shortcuts for common tasks

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["arepy_ui"]
omit = [
    "arepy_ui/debug.py",
    "arepy_ui/logging.py",
    "arepy_ui/components/video.py",
    "arepy_ui/components/colorpicker/*",
    "arepy_ui/markup/parsers/*.pyx",
    "arepy_ui/markup/parsers/types.py",
    "arepy_ui/markup/loader.py",
    "arepy_ui/core/*.pyx",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def render",
    "def handle_input",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arepy_ui", "arepy_ui.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"arepy_ui" = ["assets/fonts/**/*"]
"arepy_ui.markup.parsers" = ["*.pyx", "*.pxd"]
"arepy_ui.core" = ["*.pyx", "*.pxd"]
"arepy_ui.components.colorpicker" = ["*.pyx", "*.pxd"]

[tool.cython]
language_level = 3

# cibuildwheel configuration
[tool.cibuildwheel]
build-verbosity = 1
skip = "*-musllinux_* *-win32 *-manylinux_i686"

[tool.cibuildwheel.linux]
before-build = "pip install cython>=3.0"

[tool.cibuildwheel.macos]
# raylib isn't supported on macOS
before-build = "pip install cython>=3.0"

[tool.cibuildwheel.windows]
before-build = "pip install cython>=3.0"

[tool.uv.sources]
arepy = { git = "https://github.com/Scr44gr/arepy", rev = "main" }

[tool.ty.environment]
root = ["./"]
